[project]
name = "swi-mgmt"
version = "0.11.3"
description = "Network switch management for event engineers (audio/light/video)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pysnmp>=6.2,<7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "cairosvg>=2.7",
    "pillow>=10.0",
]

[project.scripts]
swi-mgmt-api = "swi_mgmt.api.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
